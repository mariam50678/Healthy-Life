<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healthy Life</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #f5f5f5;
    }



    .navbar{
      background-color: white;
      padding: 20px 40px;
      overflow: hidden;
    }

    .logo{
      float: left;
      color: #8aad67;
      font-size: 22px;
      font-weight: bold;
    }

    .logo img{
      width: 70px;
      vertical-align: middle;
    }

    .menu{
      float: right;
      margin-top: 25px;
    }

    .menu a{
      text-decoration: none;
      margin-left: 25px;
      color: #8aa0d4;
      font-weight: bold;
    }

    .menu a:hover{
      color: #7ca65b;
      text-decoration: underline;
    }



    .container{
      background-color: #e8eee3;
      margin: 20px auto;
      width: 88%;
      padding: 60px;
      overflow: hidden;
      border: 1px solid #e8eee3;
      border-radius: 25px;
    }

    .text{
      width: 55%;
      float: left;
      margin-top: 40px;
    }

    .text h1{
      color: #8aad67;
      font-size: 60px;
      margin-bottom: 25px;
    }

    .text h3{
      color: #444;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .text p{
      color: #444;
      line-height: 1.7;
      font-size: 18px;
      margin-bottom: 35px;
      width: 90%;
    }



    .button-box{
      text-align: center;
      margin-top: 30px;
    }

    .btn{
      background-color: #8aad67;
      color: white;
      border: 1px solid #8aad67;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 12px;
    }

    .btn:hover{
      background-color: #769b56;
    }



    #tip{
      margin-top: 25px;
      font-size: 20px;
      color: #6ac47a;
      text-align: center;
      font-weight: bold;
    }



    .image{
      float: right;
      width: 35%;
      text-align: center;
    }

    .image img{
      width: 70%;
      border-radius: 20px;
    }

  </style>
</head>

<body onload="welcomeMessage()">



<div class="navbar">

  <div class="logo">
    <img src="logo.JPEG" alt="logo">
    <span>Healthy Life</span>
  </div>

  <div class="menu">
    <a href="index.html">Home</a>
    <a href="Nutrition.html">Nutrition</a>
    <a href="Sleep & Wellness.html">Wellness</a>
  </div>

</div>



<div class="container">

  <div class="text">

    <h1>Welcome to Healthy Life</h1>

    <h3>Your guide to healthy food, exercise, and better sleep.</h3>

    <p>
      This website helps you learn about healthy food,
      exercise, and good sleep habits to live a better life.
    </p>

    <div class="button-box">

      <button class="btn" onclick="showTip()">
        Tip of the Day
      </button>

      <div id="tip"></div>

    </div>

  </div>

  <div class="image">
    <img src="food.jpeg" alt="Healthy Food">
  </div>

</div>

<script>

  function welcomeMessage(){
    window.alert("Welcome to Healthy Life!");
  }

  var tips = [
    "Drink at least 8 glasses of water every day.",
    "Take a 10-minute walk after your meals.",
    "Eat more fruits and vegetables for better energy.",
    "Try to sleep and wake up at the same time daily.",
    "Limit your intake of processed sugars and soda.",
    "Take deep breaths to reduce stress during the day."
  ];

  function showTip(){

    var randomTip =
            tips[Math.floor(Math.random() * tips.length)];

    document.getElementById("tip").innerHTML = randomTip;

  }

</script>
</body>
</html>
